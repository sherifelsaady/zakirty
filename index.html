<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ذاكرتي – Zakirty</title>
<meta name="theme-color" content="#0f766e">
<style>
:root{
--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;
--fs-xs:12px;--fs-sm:13.5px;--fs-md:15px;--fs-lg:17px;--fs-xl:21px;--fs-2xl:26px;
--bg:#f1f5f8;--card:#fff;--card-2:#f7fafc;--text:#122033;--muted:#64748b;--border:#e2e8f0;
--accent:#0f766e;--accent-soft:color-mix(in srgb,var(--accent) 11%,transparent);--acc-t:var(--accent);
--acc-grad:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 58%,#0b1220));
--ok:#16a34a;--info:#2563eb;--warn:#d97706;--danger:#dc2626;--purple:#7c3aed;
--sh-1:0 1px 2px rgba(15,23,42,.05);
--sh-2:0 2px 4px rgba(15,23,42,.04),0 10px 24px -8px rgba(15,23,42,.12);
--sh-3:0 14px 44px -8px rgba(15,23,42,.30);
--r-sm:10px;--r:16px;--r-lg:22px;--touch:44px;--side-w:272px;--nav-h:64px;
}
[data-theme=dark]{--bg:#0a1017;--card:#131c26;--card-2:#17222e;--text:#e7eef6;--muted:#8fa3b8;--border:#233140;
--accent-soft:color-mix(in srgb,var(--accent) 24%,transparent);--acc-t:color-mix(in srgb,var(--accent) 48%,#fff);
--sh-1:0 1px 2px rgba(0,0,0,.4);--sh-2:0 2px 4px rgba(0,0,0,.3),0 10px 24px -8px rgba(0,0,0,.5);--sh-3:0 14px 44px -8px rgba(0,0,0,.65)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:system-ui,"Segoe UI","Noto Sans Arabic","Noto Naskh Arabic",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;font-size:var(--fs-md);min-height:100vh;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:0;touch-action:manipulation}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc-t);text-decoration:none}
h1,h2,h3,h4{line-height:1.35}
small,.muted{color:var(--muted)}
[hidden]{display:none!important}
.ic{width:20px;height:20px;flex:none;display:inline-block;vertical-align:middle;line-height:1}
.ic.sm{width:16px;height:16px}
#app{display:flex;min-height:100vh}
#side{width:var(--side-w);background:var(--card);border-inline-end:1px solid var(--border);position:fixed;inset-block:0;inset-inline-start:0;display:flex;flex-direction:column;padding:18px 14px;z-index:60;overflow:auto;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#main{margin-inline-start:var(--side-w);flex:1;min-width:0}
.brand{display:flex;align-items:center;gap:var(--sp-3);padding:4px 8px 18px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--acc-grad);color:#fff;display:grid;place-items:center;font-weight:800;font-size:var(--fs-xl);box-shadow:0 8px 18px -8px var(--accent)}
.brand b{font-size:var(--fs-lg);display:block;line-height:1.1}
.brand small{font-size:var(--fs-xs);display:block}
.nav a{display:flex;align-items:center;gap:var(--sp-3);padding:10px 12px;border-radius:12px;color:var(--muted);font-weight:600;margin-bottom:3px;cursor:pointer;min-height:var(--touch);transition:background .15s,color .15s}
.nav a:hover{background:var(--accent-soft);color:var(--text)}
.nav a.on,.nav a[aria-current=page]{background:var(--accent);color:#fff;box-shadow:0 8px 18px -8px var(--accent)}
.nav .sep{height:1px;background:var(--border);margin:var(--sp-3) var(--sp-1)}
.nav .cnt{margin-inline-start:auto;background:var(--danger);color:#fff;border-radius:99px;font-size:var(--fs-xs);padding:0 7px;min-width:21px;text-align:center;font-weight:700}
.slogan{margin-top:auto;padding:var(--sp-3);border-radius:14px;background:var(--accent-soft);font-size:var(--fs-sm);color:var(--text);line-height:1.6}
.sidefoot{margin-top:12px;text-align:center;font-size:var(--fs-xs);color:var(--muted);padding:8px var(--sp-2);border-top:1px dashed var(--border);line-height:1.6}
.sidefoot b{color:var(--acc-t);font-weight:800}
.appfoot{text-align:center;color:var(--muted);font-size:var(--fs-xs);margin-top:var(--sp-6);padding:var(--sp-4) var(--sp-2) calc(var(--sp-4) + env(safe-area-inset-bottom,0px));border-top:2px dashed var(--border);line-height:1.6}
.appfoot b{color:var(--acc-t);font-weight:800}
@media(max-width:900px){.sidefoot{display:none}}
#top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);display:flex;gap:var(--sp-2);align-items:center;padding:12px var(--sp-6);border-bottom:1px solid var(--border)}
.sbox{position:relative;flex:1;max-width:680px}
.sbox input{width:100%;border:1px solid var(--border);background:var(--card);border-radius:14px;padding:11px 44px 11px 14px;outline:none;min-height:var(--touch);box-shadow:var(--sh-1);transition:border-color .15s,box-shadow .15s}
.sbox input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
#sIc{position:absolute;right:14px;top:0;height:var(--touch);display:grid;place-items:center;color:var(--muted);pointer-events:none}
.srbox{position:absolute;top:calc(100% + 8px);inset-inline:0;background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh-3);max-height:70vh;overflow:auto;padding:var(--sp-2);z-index:50}
.srsec{font-size:var(--fs-xs);color:var(--muted);font-weight:700;padding:var(--sp-2) var(--sp-2) var(--sp-1);display:flex;align-items:center;gap:6px;flex-wrap:nowrap;line-height:1.4;overflow:hidden}
.srsec>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srrow{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;cursor:pointer;width:100%;text-align:start;background:transparent;border:0;color:inherit;font:inherit}
.srrow:hover,.srrow:focus{background:var(--accent-soft);outline:none}
.sr-ico{width:36px;height:36px;border-radius:11px;background:var(--accent-soft);display:grid;place-items:center;font-size:16px;flex:none;overflow:hidden;color:var(--acc-t)}
.sr-txt{flex:1;min-width:0}
.sr-txt b,.sr-txt small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-txt b{font-size:var(--fs-sm)}
.sr-txt small{font-size:var(--fs-xs);color:var(--muted)}
.srrow .badge{flex:none}
.tbtn{position:relative;width:var(--touch);height:var(--touch);border-radius:14px;border:1px solid var(--border);background:var(--card);display:grid;place-items:center;box-shadow:var(--sh-1);transition:border-color .15s,color .15s}
.tbtn:hover{border-color:var(--accent);color:var(--acc-t)}
.tbtn .dot{position:absolute;top:-6px;inset-inline-start:-6px;background:var(--danger);color:#fff;border-radius:99px;font-size:10.5px;min-width:19px;height:19px;display:grid;place-items:center;padding:0 5px;font-weight:700;border:2px solid var(--bg)}
#menuBtn{display:none}
#view{padding:var(--sp-6);max-width:1360px;margin:auto;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.boot{display:grid;place-items:center;min-height:50vh}
#warn .wb{margin:var(--sp-3) var(--sp-6) 0;padding:10px 14px;border-radius:14px;background:#fef3c7;color:#78350f;font-size:var(--fs-sm);border:1px solid #fcd34d}
#warn .wb.bad{background:#fee2e2;color:#7f1d1d;border-color:#fca5a5}
.phead{display:flex;flex-wrap:wrap;gap:var(--sp-3);align-items:center;justify-content:space-between;margin-bottom:var(--sp-4)}
.phead h1{font-size:var(--fs-2xl);letter-spacing:-.2px}
.phead p{color:var(--muted);font-size:var(--fs-sm)}
.pact{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh-1);padding:18px;overflow-wrap:anywhere;transition:box-shadow .2s,border-color .2s,transform .2s}
.card h3{font-size:var(--fs-md);margin-bottom:var(--sp-2);display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:var(--sp-4)}
.grid.s{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.grid>*{min-width:0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:var(--sp-4);margin-top:var(--sp-4);align-items:start}
.stat{display:flex;gap:var(--sp-3);align-items:center;cursor:pointer}
.stat:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--sh-2)}
.stat .si{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:var(--accent-soft);color:var(--acc-t);flex:none}
.stat b{font-size:var(--fs-xl);display:block;line-height:1.2}
.stat small{display:block;font-size:var(--fs-xs)}
.hero{position:relative;overflow:hidden;color:#fff;background:var(--acc-grad);padding:24px;border-radius:var(--r-lg);margin-bottom:var(--sp-4);box-shadow:0 18px 36px -18px var(--accent)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.10);pointer-events:none}
.hero::before{width:240px;height:240px;inset-inline-end:-70px;top:-100px}
.hero::after{width:150px;height:150px;inset-inline-end:110px;bottom:-90px}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:var(--fs-xl)}
.hero p{opacity:.92;margin-top:4px;font-size:var(--fs-sm)}
.hero a{color:#fff;text-decoration:underline;font-weight:700}
.qa{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--sp-3)}
.qa button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:16px;border:1px solid var(--border);background:var(--card);font-weight:700;font-size:var(--fs-sm);box-shadow:var(--sh-1);transition:transform .15s,border-color .15s,box-shadow .15s;min-height:var(--touch)}
.qa button .qi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--acc-t)}
.qa button:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--sh-2)}
.welcome{border-color:color-mix(in srgb,var(--accent) 45%,var(--border));background:linear-gradient(180deg,var(--accent-soft),var(--card));margin-bottom:var(--sp-4)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--sp-3);margin:var(--sp-3) 0}
.steps div{display:flex;gap:10px;align-items:flex-start;font-size:var(--fs-sm)}
.steps i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:var(--fs-sm)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--card);padding:9px 15px;border-radius:12px;font-weight:600;font-size:var(--fs-sm);transition:transform .12s,border-color .15s,color .15s,box-shadow .15s,filter .15s;white-space:nowrap;min-height:var(--touch);box-shadow:var(--sh-1)}
.btn:hover{border-color:var(--accent);color:var(--acc-t)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 8px 18px -10px var(--accent)}
.btn.pri:hover{filter:brightness(1.08);color:#fff}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger:hover{color:#fff;filter:brightness(1.08)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.sm{padding:5px 11px;font-size:var(--fs-xs);border-radius:10px;min-height:34px}
.btn.icon{padding:7px;aspect-ratio:1;min-height:38px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;font-size:var(--fs-xs);font-weight:700;background:var(--accent-soft);color:var(--acc-t);white-space:nowrap}
.badge button{display:inline-grid;place-items:center;min-width:28px;min-height:28px;border-radius:50%;color:inherit}
.badge button:hover{background:var(--accent-soft)}
.badge.ok{background:rgba(22,163,74,.14);color:var(--ok)}
.badge.warn{background:rgba(217,119,6,.16);color:var(--warn)}
.badge.bad{background:rgba(220,38,38,.14);color:var(--danger)}
.badge.info{background:rgba(37,99,235,.14);color:var(--info)}
.badge.pur{background:rgba(124,58,237,.15);color:var(--purple)}
.badge.gray{background:var(--border);color:var(--muted)}
[data-theme=dark] .badge.ok{color:#4ade80}[data-theme=dark] .badge.warn{color:#fbbf24}[data-theme=dark] .badge.bad{color:#f87171}[data-theme=dark] .badge.info{color:#7cb0ff}[data-theme=dark] .badge.pur{color:#b794f6}
.bar{height:8px;background:var(--border);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;transition:width .4s}
.tabs{display:flex;gap:6px;margin-bottom:var(--sp-3);flex-wrap:wrap}
.tabs button{padding:8px 16px;border-radius:99px;border:1px solid var(--border);background:var(--card);font-weight:600;font-size:var(--fs-sm);min-height:38px;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.tabs button:hover{border-color:var(--accent)}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:var(--fs-sm);margin-bottom:var(--sp-3);color:var(--muted)}
.crumbs a{cursor:pointer;padding:3px 8px;border-radius:8px}
.crumbs a:hover{background:var(--accent-soft)}
.crumbs .cur{font-weight:700;color:var(--text)}
.pcard{display:flex;flex-direction:column;gap:var(--sp-2);cursor:pointer}
.pcard:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--sh-2)}
.pimg{width:54px;height:54px;border-radius:16px;background:var(--accent-soft);display:grid;place-items:center;font-size:27px;overflow:hidden;flex:none;color:var(--acc-t)}
.pimg img{width:100%;height:100%;object-fit:cover}
.pimg.lg{width:88px;height:88px;font-size:44px;border-radius:22px}
.row{display:flex;gap:var(--sp-3);align-items:center}
.row.top{align-items:flex-start}
.grow{flex:1;min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.favb{position:absolute;top:10px;inset-inline-end:10px;color:var(--muted);padding:6px;border-radius:10px;z-index:2;min-width:36px;min-height:36px;display:grid;place-items:center}
.favb:hover{background:var(--accent-soft)}
.favb.on{color:#f59e0b}
.favb.on .ic{fill:currentColor}
.acts{display:flex;gap:4px;flex-wrap:wrap}
.item.off{opacity:.92;border-style:dashed}
.lrow{display:flex;gap:var(--sp-3);align-items:center;padding:11px 8px;border-bottom:1px solid var(--border);cursor:pointer;border-radius:10px;transition:background .12s}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--accent-soft)}
.tnode summary{display:flex;align-items:center;gap:var(--sp-2);padding:8px;border-radius:12px;cursor:pointer;list-style:none;min-height:40px}
.tnode summary::-webkit-details-marker{display:none}
.tnode summary:hover{background:var(--accent-soft)}
.tnode summary::before{content:"◂";font-size:11px;color:var(--muted);transition:.15s}
.tnode[open]>summary::before{transform:rotate(-90deg)}
.tin{margin-inline-start:20px;border-inline-start:2px solid var(--border);padding-inline-start:8px}
.tleaf{display:flex;gap:var(--sp-2);align-items:center;padding:7px 8px;border-radius:10px;cursor:pointer;font-size:var(--fs-sm)}
.tleaf:hover{background:var(--accent-soft)}
.tact{margin-inline-start:auto;display:flex;gap:2px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .ic{width:68px;height:68px;padding:18px;border-radius:50%;background:var(--accent-soft);color:var(--acc-t);margin-bottom:var(--sp-3)}
.empty h4{color:var(--text);margin-bottom:4px;font-size:var(--fs-lg)}
.empty .btn{margin-top:var(--sp-3)}
.counter{display:flex;align-items:center;justify-content:center;gap:var(--sp-4);margin:var(--sp-3) 0}
.counter b{font-size:32px;min-width:80px;text-align:center;line-height:1.1}
.counter .btn.icon{width:50px;height:50px;border-radius:50%;user-select:none;-webkit-user-select:none}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:var(--sp-2);font-size:var(--fs-sm)}
.kv div{background:var(--bg);padding:8px 12px;border-radius:12px}
.kv b{display:block;font-size:var(--fs-md)}
.mback{position:fixed;inset:0;background:rgba(8,14,22,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:14px;animation:fadeb .16s}
@keyframes fadeb{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border-radius:var(--r-lg);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;box-shadow:var(--sh-3);animation:pop .2s;z-index:1001;outline:none}
.modal.wide{max-width:800px}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:2}
.mhead h3{font-size:var(--fs-lg)}
.mbody{padding:18px 20px 22px}
.mfoot{display:flex;gap:var(--sp-2);justify-content:flex-end;margin-top:var(--sp-4);flex-wrap:wrap}
.cmsg{white-space:pre-line;line-height:1.8}
.fld{margin-bottom:var(--sp-3)}
.fld label{display:block;font-weight:600;font-size:var(--fs-sm);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--bg);outline:none;min-height:var(--touch);transition:border-color .15s,box-shadow .15s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.fld input[aria-invalid=true]{border-color:var(--danger)}
.fld small{display:block;margin-top:4px;font-size:var(--fs-xs)}
.fld input[type=color]{padding:3px;height:46px}
.fld input[type=radio],.fld input[type=checkbox]{width:auto;min-height:auto}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2)}
.rq{color:var(--danger)}
.err{color:var(--danger);font-weight:600;font-size:var(--fs-sm);min-height:0;margin-top:4px}
.err:not(:empty){background:rgba(220,38,38,.09);padding:9px 12px;border-radius:12px}
.icons{display:flex;flex-wrap:wrap;gap:6px}
.icons label{margin:0}
.icons input{display:none}
.icons span{display:grid;place-items:center;width:42px;height:42px;font-size:22px;border-radius:12px;border:2px solid var(--border);cursor:pointer;background:var(--bg);transition:.12s}
.icons input:checked+span{border-color:var(--accent);background:var(--accent-soft)}
.imgfld{display:flex;gap:var(--sp-2);align-items:center}
.imgprev{width:66px;height:66px;border-radius:16px;border:1px dashed var(--border);display:grid;place-items:center;overflow:hidden;color:var(--muted);background:var(--bg)}
.imgprev img{width:100%;height:100%;object-fit:cover}
.imgbtns{display:flex;gap:6px;flex-wrap:wrap}
.qrbox{text-align:center}
.qrbox svg{max-width:260px;width:100%;height:auto;border:8px solid #fff;border-radius:12px;box-shadow:var(--sh-2)}
.code{direction:ltr;font-family:monospace;font-size:var(--fs-xs);background:var(--bg);padding:6px 10px;border-radius:8px;word-break:break-all;display:inline-block;margin-top:var(--sp-2)}
#toasts{position:fixed;bottom:24px;inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:var(--sp-2);z-index:2000;pointer-events:none}

 const phone=(d.phone||'').trim();if(phone&&!/^[0-9٠-٩+\-\s()]{6,20}$/.test(phone))throw new Error('رقم الهاتف غير صالح');

 const hasTx=p&&all('txs').some(t=>t.productId===p.id);
 let original=p?p.original:null,current=p?p.current:null;
 if(!p||!hasTx){const o=num(d.original,'الكمية الأصلية',{gt:true});original=r3(o);current=original;}
 const min=num(d.min,'الحد الأدنى للتنبيه',{req:false});if(d.expiry&&!validDate(d.expiry))throw new Error('تاريخ الصلاحية غير صالح');

 await commit([['put','products',rec],logOp(p?'prod_edit':'prod_add',name,`${fmtNum(rec.original)} ${unit}`,rec.id)]);return rec;}
async function changeQty(id,type,qty,note,opts={}){
 const p=get('products',id);if(!p)throw new Error('المنتج غير موجود');if(!['add','consume'].includes(type))throw new Error('نوع الحركة غير صالح');
 const q=r3(num(qty,'الكمية',{gt:true}));const before=p.current;
 if(type==='add' && r3(before+q) > p.original + 1e-9){
   if(!opts.raiseOriginal){const e=new Error(`لا يمكن تجاوز الكمية الأصلية (${fmtNum(p.original)} ${p.unit}). هل تريد رفع الكمية الأصلية إلى ${fmtNum(r3(before+q))} ${p.unit}؟`);e.originalOverflow=r3(before+q);throw e;}
 }
 let after=type==='add'?r3(before+q):r3(before-q);
 if(after<0)throw new Error(`لا يمكن أن تنزل الكمية تحت الصفر. المتاح حالياً ${fmtNum(before)} ${p.unit}.`);
 const upd={...p,current:after};
 if(type==='add'&&after>p.original)upd.original=after;
 const tx={id:uid('tx'),productId:id,productName:p.name,type,qty:q,before,after,time:nowISO(),note:note||'',originalBefore:p.original,originalAfter:upd.original};
 await commit([['put','products',upd],['put','txs',tx],logOp(type==='add'?'qty_add':'qty_use',p.name,`${type==='add'?'+':'−'}${fmtNum(q)} ${p.unit} (${fmtNum(before)} ← ${fmtNum(after)})${type==='add'&&upd.original!==p.original?`\nرفع الكمية الأصلية: ${fmtNum(p.original)} ← ${fmtNum(upd.original)}`:''}${note?'\n'+note:''}`,id)]);return {tx,prev:{...p}};}

 if(o<p.current-1e-9)throw new Error(`لا يمكن أن تكون الكمية الأصلية (${fmtNum(o)}) أقل من الكمية الحالية (${fmtNum(p.current)}). استهلك الكمية أولاً ثم عدّل.`);

let _alC=null,_alT=0,_alR=null;
function invalidateAlerts(){_alC=null;_alR=null;}
function getAlertsRaw(){getAlerts();return _alR;}
function getAlerts(){const n=Date.now();if(_alC&&n-_alT<20000)return _alC;_alR=computeAlerts();const dm=set('dismissedAlerts')||{};_alC=_alR.filter(a=>!dm[a.key]);_alT=n;return _alC;}
function computeAlerts(){
  const A=[];
  const add=(level,kind,title,sub,t,id,keySuffix)=>{
    const key=kind+'|'+id+'|'+(keySuffix||title);
    A.push({level,kind,title,sub,t,id,key});
  };
  if(set('nLoan')) for(const l of all('loans')){
    const s=loanState(l);
    if(s.k==='overdue'){
      add('danger','loan','متأخرة: '+l.itemName,
        `مع ${l.borrower} – متأخرة ${s.days} يوم (كان الموعد ${fmtDateStr(l.dueDate)})`,
        'loan',l.id, 'overdue|'+s.days);
    } else if(s.k==='today'){
      add('warn','loan','مستحقة اليوم: '+l.itemName,`مع ${l.borrower}`,'loan',l.id,'today');
    } else if(s.k==='soon'){
      add('warn','loan','يقترب إرجاع: '+l.itemName,
        `مع ${l.borrower} – بعد ${s.days} يوم (${fmtDateStr(l.dueDate)})`,
        'loan',l.id,'soon|'+s.days);
    } else if(s.k==='completed'&&l.returnDate&&dayDiff(l.returnDate.slice(0,10),todayStr())<=7){
      add('ok','returned','تم إرجاع: '+l.itemName,
        `من ${l.borrower} بتاريخ ${fmtDT(l.returnDate)}`,
        'loan',l.id,'returned');
    }
  }
  for(const p of all('products')){
    const s=pState(p);
    if(set('nLow')){
      if(s.out){
        add('danger','stock','نفدت الكمية: '+p.name,'الكمية الحالية صفر','product',p.id,'out');
      } else if(s.low){
        add('warn','stock','اقتربت من النفاد: '+p.name,
          `المتبقي ${fmtNum(p.current)} ${p.unit} (الحد ${fmtNum(p.min)})`,
          'product',p.id,'low|'+p.current);
      }
    }
    if(set('nExpiry')&&p.expiry){
      if(s.expired){
        add('danger','expiry','منتهي الصلاحية: '+p.name,
          'انتهت الصلاحية '+fmtDateStr(p.expiry),'product',p.id,'expired|'+p.expiry);
      } else if(s.expiring){
        add('warn','expiry','تقترب صلاحية: '+p.name,
          `بعد ${s.days} يوم (${fmtDateStr(p.expiry)})`,
          'product',p.id,'expiring|'+s.days);
      }
    }
  }
  if(set('nRem')) for(const r of all('reminders')){
    if(!r.done&&new Date(r.date)<=new Date()){
      add('warn','reminder','تذكير: '+r.title,
        'موعده '+fmtDT(new Date(r.date).toISOString()),
        'reminder',r.id,'due|'+r.date);
    }
  }
  if(all('places').length+all('items').length>0){
    const lb=+set('lastBackup')||0;
    if(!lb){
      add('warn','backup','لم تصدّر نسخة احتياطية بعد',
        'بياناتك داخل المتصفح فقط، صدّر نسخة الآن','settings','x','never');
    } else {
      const dd=Math.floor((Date.now()-lb)/864e5);
      if(dd>=14){
        const week=Math.floor(dd/7);
        add('warn','backup',`مضى ${dd} يوماً على آخر نسخة احتياطية`,
          'بياناتك داخل المتصفح فقط، صدّر نسخة الآن','settings','x','week|'+week);
      }
    }
  }
  const o={danger:0,warn:1,ok:2};
  return A.sort((a,b)=>o[a.level]-o[b.level]);
}
let _skArr=null,_skSet=null;
const skSet=()=>{const a=set('seenKeys')||[];if(a!==_skArr){_skArr=a;_skSet=new Set(a);}return _skSet;};
function isAlertSeen(a){
  const va=set('viewedAlerts')||{};
  return !!va[a.key]||skSet().has(a.key);
}
function markViewed(keys){
  if(!Array.isArray(keys)||!keys.length)return;
  const cur={...(set('viewedAlerts')||{})};
  const now=Date.now();
  let changed=false;
  for(const k of keys){ if(cur[k]!==now){cur[k]=now;changed=true;} }
  if(!changed)return;
  const entries=Object.entries(cur).sort((a,b)=>b[1]-a[1]).slice(0,500);
  const rec={key:'viewedAlerts',value:Object.fromEntries(entries)};
  M.settings.set('viewedAlerts',rec);
  commit([['put','settings',rec]]).catch(e=>console.warn('فشل حفظ viewedAlerts:',e));
}
async function clearSeenAlerts(){

 for(const a of getAlerts()){if(isAlertSeen(a)){nx[a.key]=now;n++;}}
 if(!n)return {n:0,prev};
 const rec={key:'dismissedAlerts',value:nx};
 M.settings.set('dismissedAlerts',rec);invalidateAlerts();
 await commit([['put','settings',rec],logOp('alerts_clear','مسح التنبيهات المقروءة',`${n} تنبيه`)]);

}
function pruneSeen(){
  try{
    const liveKeys=new Set(getAlertsRaw().map(a=>a.key));
    const now=Date.now();
    const TTL=30*864e5;
    const va={...(set('viewedAlerts')||{})};
    let vaChanged=false;
    for(const k of Object.keys(va)){
      if(!liveKeys.has(k)&&(now-va[k])>TTL){delete va[k];vaChanged=true;}
    }
    const sk=set('seenKeys')||[];
    const nxSk=sk.filter(k=>liveKeys.has(k));
    const ops=[];
    const dm=set('dismissedAlerts')||{};const dn={};let dCh=false;
    for(const k of Object.keys(dm)){if(liveKeys.has(k))dn[k]=dm[k];else dCh=true;}
    if(dCh){const rec={key:'dismissedAlerts',value:dn};M.settings.set('dismissedAlerts',rec);ops.push(['put','settings',rec]);invalidateAlerts();}
    if(vaChanged){const rec={key:'viewedAlerts',value:va};M.settings.set('viewedAlerts',rec);ops.push(['put','settings',rec]);}
    if(nxSk.length!==sk.length){const rec={key:'seenKeys',value:nxSk};M.settings.set('seenKeys',rec);ops.push(['put','settings',rec]);}
    if(ops.length)commit(ops).catch(e=>console.warn('فشل حفظ تنظيف التنبيهات:',e));
  }catch(e){console.warn('pruneSeen:',e);}
}
function getDisplayedAlertKeys(){
  const A=getAlerts();
  const groups={loan:1e9,returned:1e9,stock:1e9,expiry:1e9,reminder:1e9,backup:1e9};
  const keys=[];
  for(const [kind,max] of Object.entries(groups)){
    A.filter(a=>a.kind===kind).slice(0,max).forEach(a=>keys.push(a.key));
  }
  return keys;
}
function migrateViewedKeys(){
  try{
    const old=set('viewedKeys');
    if(Array.isArray(old)&&old.length){

      const now=Date.now();
      old.forEach(k=>{if(!va[k])va[k]=now;});

      M.settings.set('viewedAlerts',rec);
      commit([['put','settings',rec],['del','settings','viewedKeys']]).catch(()=>{});
    }
  }catch(e){}
}

let scanTimer=null,scanStream=null;
function stopScan(){clearInterval(scanTimer);scanTimer=null;if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null;}}
function handleCode(raw){const m=/^ZAKIRTY:place:([\w-]+)$/.exec((raw||'').trim());if(!m||!get('places',m[1])){toast('الرمز غير معروف أو أن المكان محذوف','bad');return false;}while(modalStack.length)closeModal(modalStack[modalStack.length-1]);toast('تم فتح المكان');go('place',m[1]);return true;}
function openScanner(){
 const m=openModal({title:'مسح رمز QR',onClose:stopScan,body:`<div class="qrbox"><video id="scanVid" playsinline muted style="width:100%;max-width:360px;border-radius:12px;background:#000;display:none"></video><p class="muted" id="scanMsg"></p></div><div class="fld"><label for="scanTxt">أو الصق/اكتب نص الرمز يدوياً</label><input id="scanTxt" dir="ltr" placeholder="ZAKIRTY:place:…"></div><div class="mfoot"><label class="btn"><input type="file" accept="image/*" id="scanFile" hidden>${ic('upload','sm')} قراءة من صورة</label><button class="btn pri" id="scanGo">فتح</button></div>`});
 const msg=$('#scanMsg',m),vid=$('#scanVid',m);$('#scanGo',m).onclick=()=>handleCode($('#scanTxt',m).value);
 $('#scanTxt',m).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();handleCode(e.target.value);}});
 if(!('BarcodeDetector' in window)){msg.textContent='متصفحك لا يدعم قراءة الرمز تلقائياً. امسح الرمز بكاميرا الجوال ثم الصق النص الناتج في الحقل أدناه.';return;}
 let det;try{det=new BarcodeDetector({formats:['qr_code']});}catch(e){msg.textContent='تعذر تهيئة قارئ الرموز.';return;}
 $('#scanFile',m).onchange=async e=>{
const f=e.target.files[0];if(!f)return;try{const bmp=await createImageBitmap(f);const r=await det.detect(bmp);if(!r.length)toast('لم يُعثر على رمز في الصورة','bad');else handleCode(r[0].rawValue);}catch(err){toast('تعذرت قراءة الصورة','bad');}};
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg.textContent='الكاميرا غير متاحة (قد تحتاج اتصالاً آمناً https أو خادماً محلياً). استخدم القراءة من صورة أو الإدخال اليدوي. راجع «دليل الاستخدام» لطريقة التشغيل عبر خادم محلي.';return;}
 navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(s=>{scanStream=s;vid.srcObject=s;vid.style.display='block';vid.play();msg.textContent='وجّه الكاميرا نحو الرمز…';scanTimer=setInterval(async()=>{try{const r=await det.detect(vid);if(r.length&&handleCode(r[0].rawValue))stopScan();}catch(e){}},400);}).catch(()=>{msg.textContent='لم يُسمح بالوصول إلى الكاميرا. استخدم القراءة من صورة أو الإدخال اليدوي.';});}

function bindQtyHold(el,id,type){
 if(el._zkHold)return; el._zkHold=true;
 let intervalId=null,timeoutId=null,delayId=null,held=false,sx=0,sy=0;
 const tick=()=>{ if(held) qtyQuick(id,type); };
 const arm=()=>{ timeoutId=setTimeout(()=>{ if(!held)return; intervalId=setInterval(tick,450); },500); };
 const start=e=>{
   if(e&&e.pointerType==='mouse'&&e.button!==0)return;
   if(held)return;
   held=true;
   if(e&&e.pointerType==='touch'){ sx=e.clientX;sy=e.clientY; delayId=setTimeout(()=>{ delayId=null; if(!held)return; qtyQuick(id,type); arm(); },130); }
   else{ qtyQuick(id,type); arm(); }
 };
 const stop=()=>{
   if(!held)return;
   held=false;
   if(delayId){clearTimeout(delayId);delayId=null;}
   if(timeoutId){clearTimeout(timeoutId);timeoutId=null;}
   if(intervalId){clearInterval(intervalId);intervalId=null;}
 };
 const up=()=>{ if(held&&delayId){ clearTimeout(delayId);delayId=null;held=false;qtyQuick(id,type); } };
 stop._el=up._el=el;
 el.addEventListener('pointerdown',start);
 el.addEventListener('pointermove',e=>{ if(delayId&&Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>10)stop(); });
 el.addEventListener('pointerleave',e=>{ if(e.pointerType==='mouse') stop(); });
 const prune=S=>{ if(S.size>120)S.forEach(f=>{ if(f._el&&!f._el.isConnected){ S.delete(f); } }); };
 prune(window._zkQtyStop);prune(window._zkQtyUp);
 window._zkQtyStop.add(stop);window._zkQtyUp.add(up);
}

 if(!total)return h+empty('star','لا توجد عناصر مفضلة','اضغط على النجمة في أي مكان أو غرض أو وحدة أو منتج لإضافته هنا.');

function vNotif(){
  const A0=getAlerts(),A=ui.nTab==='unread'?A0.filter(a=>!isAlertSeen(a)):A0;
  const seenCount=A0.filter(isAlertSeen).length;
  const hidN=getAlertsRaw().length-A0.length;
  let h=head('التنبيهات','كل ما يحتاج انتباهك الآن',
    `<button class="btn" data-act="markAllSeen">${ic('check','sm')} تم الاطلاع على الكل</button>`+
    ((seenCount||(set('autoSeen')!==false&&A0.length))?`<button class="btn danger" data-act="clearSeen">${ic('trash','sm')} مسح المقروءة${seenCount?` (${seenCount})`:''}</button>`:'')+(hidN>0?`<button class="btn" data-act="restoreDismissed">إظهار المخفية (${hidN})</button>`:''));
  h+=`<div class="tabs"><button class="${ui.nTab!=='unread'?'on':''}" data-act="nTab" data-p="all">الكل (${A0.length})</button><button class="${ui.nTab==='unread'?'on':''}" data-act="nTab" data-p="unread">غير المقروءة (${A0.filter(a=>!isAlertSeen(a)).length})</button></div>`;
  if(!A.length)return h+empty('check',ui.nTab==='unread'?'لا توجد تنبيهات غير مقروءة ✨':'كل شيء على ما يرام ✨','لا توجد تنبيهات حالياً.');
  const groups=[['loan','الإعارات','swap'],['returned','تم إرجاعها مؤخراً','check'],['stock','المخزون','stock'],['expiry','الصلاحية','calendar'],['reminder','التذكيرات','bell'],['backup','النسخ الاحتياطي','download']];
  for(const [k,l,i] of groups){
    const a=A.filter(x=>x.kind===k);
    if(!a.length)continue;
    h+=`<div class="card" style="margin-bottom:14px"><h3>${ic(i)} ${l} (${a.length})</h3>${a.map(x=>{
      const seen=isAlertSeen(x);
      return `<div class="al ${x.level}${seen?' seen':''}" data-act="open" data-t="${x.t}" data-id="${x.id}" role="button" tabindex="0"><div class="grow"><b>${esc(x.title)}</b><br><small>${esc(x.sub)}</small></div></div>`;
    }).join('')}</div>`;
  }
  return h;}

function searchHtml(secs,limit){
  return secs.map(s=>`<div class="srsec">${ic(s.icon,'sm')}<span>${s.label} (${s.res.length})</span></div>${s.res.slice(0,limit||999).map(r=>{
    const icoHtml = (r.icon && r.type==='place') ? esc(r.icon) : ic(tIcon[r.type]||'info','sm');
    return `<button class="srrow" data-act="open" data-t="${r.type}" data-id="${esc(r.id)}">
      <span class="sr-ico">${icoHtml}</span>
      <span class="sr-txt"><b>${esc(r.title)}</b><small>${esc(r.sub||'')}</small></span>
      ${r.badge?badge(r.badge[0],r.badge[1]):''}
    </button>`;
  }).join('')}`).join('');
}
function closeSide(fromHist){const s=$('#side');if(!s||!s.classList.contains('open'))return;s.classList.remove('open');$('#ovl').classList.remove('open');if(!fromHist)ovPop(s);}
function hideSR(){const b=$('#sr');if(!b||b.hidden)return;b.hidden=true;ovPop(b);}

function openEntity(t,id){hideSR();while(modalStack.length)closeModal(modalStack[modalStack.length-1]);
 if(t==='settings'){go('settings');return;}
 if(t==='place')go('place',id);else if(t==='item'){const i=get('items',id);if(!i)return;go('place',i.placeId);setTimeout(()=>viewItem(id),60);}else if(t==='device')go('device',id);else if(t==='content'){const c=get('contents',id);if(c)go('device',c.deviceId);}else if(t==='product'){go('inventory');setTimeout(()=>viewProduct(id),60);}else if(t==='loan'){go('loans');setTimeout(()=>viewLoan(id),60);}else if(t==='reminder'){go('reminders');setTimeout(()=>{const el=document.querySelector(`[data-rem-id="${id}"]`);if(el){el.classList.add('hl');el.scrollIntoView({block:'center'});}},80);}}

function vGuide(){return head('دليل الاستخدام','ابدأ في دقائق')+`<div class="card guide">
<h3>البداية السريعة</h3><ol><li><b>أين وضعت أشيائي؟</b>: أنشئ مكاناً (المنزل)، ثم أماكن فرعية (غرفة النوم ← الدولاب ← الدرج)، ثم أضف الأغراض داخلها.</li><li>ابحث عن أي غرض من شريط البحث في الأعلى فيظهر مساره الكامل مثل: <i>المنزل ← غرفة النوم ← الدولاب ← الحقيبة</i>. اختصار لوحة المفاتيح: <code>Ctrl+K</code>.</li><li><b>مساحاتي التخزينية</b>: سجّل الفلاشات والأقراص وما بداخلها يدوياً وسيحسب التطبيق المتبقي ونسبة الامتلاء.</li><li><b>كمياتي ومخزوني</b>: سجّل منتجاً بكميته الأصلية واضغط (+) و(−) لتسجيل الإضافة والاستهلاك (الضغط المستمر يكرر الحركة)، وكل حركة تُسجَّل. يمكن التراجع عن أي حركة من زر «تراجع» في الإشعار. لتغيير <b>الكمية الأصلية</b> استخدم زر «الأصلية» في بطاقة المنتج (لا يمكن أن تقل عن الكمية الحالية)، وللجرد الفعلي استخدم «جرد الحالية» من نافذة التفاصيل. ومن زر «قائمة النواقص» تُصدّر المنتجات المنخفضة أو النافدة كملف CSV لاستخدامها في التسوّق.</li><li><b>إدارة الإعارات</b>: من بطاقة أي غرض اضغط «إعارة»، وعند عودته اضغط «تم إرجاع الغرض» فيعود إلى مكانه الأصلي (أو مكان آخر تختاره) ويبقى سجل الإعارة محفوظاً. يمكن تعديل بيانات الإعارة النشطة من زر «تعديل».</li><li><b>نسخ غرض</b>: من نافذة تفاصيل الغرض اضغط «نسخ الغرض» لإنشاء نسخة مطابقة في المكان نفسه (مفيد للأغراض المتشابهة).</li></ol>
<h3>المفضلة</h3><p>تظهر شارة العدد بجوار «المفضلة» فقط عند إضافة عناصر جديدة، وتختفي بمجرد فتح الصفحة (والأمر نفسه للتذكيرات). اضغط على النجمة في أي مكان أو غرض أو وحدة تخزين أو منتج لإضافته إلى صفحة «المفضلة» (في الشريط السفلي على الجوال، أو القائمة الجانبية على الكمبيوتر). ستظهر رسالة تأكيد عند الإضافة أو الإزالة، ويمكنك إزالة الكل من زر واحد.</p>
<h3>التنبيهات</h3><p>زر «تم الاطلاع على الكل» يعلّم التنبيهات كمقروءة. زر «مسح المقروءة» يحذف سجل الاطلاع نهائياً فتعود التنبيهات الحالية «غير مقروءة» مجدداً إن أردت مراجعتها من جديد.</p>
<h3>التحديد المتعدد وسلة المحذوفات</h3><p>في أي قائمة اضغط «تحديد» (أو اضغط مطولاً على أي عنصر في الهاتف)، ثم اختر ما تشاء أو «تحديد الكل»، وبعدها احذف أو انقل أو غيّر الحالة دفعة واحدة. على الكمبيوتر اضغط <code>Shift</code> لتحديد نطاق، و<code>Esc</code> للخروج من التحديد. كل ما تحذفه ينتقل إلى <b>سلة المحذوفات</b> ويبقى فيها المدة التي تحددها من الإعدادات (30 يوماً افتراضياً). الأغراض المعارة لا تُحذف قبل إرجاعها.</p><h3>رمز QR للأماكن</h3><p>افتح أي مكان واضغط «رمز QR» لتنزيله أو طباعته. لمسحه داخل التطبيق اضغط أيقونة QR في الأعلى. إن لم يدعم متصفحك قراءة الرمز تلقائياً فامسحه بكاميرا الهاتف والصق النص الناتج في نافذة المسح، أو ارفع صورة الرمز.</p>
<h3>النسخ الاحتياطي والتصدير</h3><p>من الإعدادات صدّر نسخة JSON كاملة (تشمل الصور والإعارات). احتفظ بها خارج المتصفح. سينبهك التطبيق إذا مضى 14 يوماً على آخر نسخة، ويعيد التنبيه كل أسبوع. عند الاستيراد يتحقق التطبيق من الملف وينشئ نسخة من وضعك الحالي قبل الاستبدال. يمكنك أيضاً تصدير الأغراض أو المنتجات بصيغة CSV لفتحها في Excel.</p>
<h3>تشغيل الملف دون استضافة</h3><p>افتح <code>Zakirty.html</code> بالنقر المزدوج في Chrome أو Edge أو Firefox. بعض المتصفحات (مثل Safari أو وضع التصفح الخاص) قد تمنع IndexedDB عند الفتح المباشر <code>file://</code>؛ وفي هذه الحالة يظهر شريط تحذير أحمر ويحفظ التطبيق بياناتك في تخزين احتياطي (localStorage) قدر الإمكان، فاحرص على النسخ الاحتياطي. الحل المحلي الأفضل دون أي استضافة خارجية: افتح الطرفية في مجلد الملف ونفّذ <code>python3 -m http.server 8000</code> ثم افتح <code>http://localhost:8000/Zakirty.html</code>. تبقى البيانات مرتبطة بهذا العنوان، فاستخدم العنوان نفسه دائماً.</p>
<h3>ملاحظات مهمة</h3><ul><li>لا يقرأ التطبيق ملفات الفلاشة فعلياً؛ المحتويات تُدخَل يدوياً.</li><li>قسم الكميات لإدارة المخزون فقط وليس للجرعات الدوائية أو الإرشاد العلاجي.</li><li>سجل النشاط وحركات الكميات والإعارات لا تُعدَّل حفاظاً على سلامة الحسابات.</li><li>إذا كنت تملأ نموذجاً ولم تحفظه، يظهر تنبيه قبل مغادرة الصفحة.</li></ul></div>`;}

 if(it.status==='loaned'||loanOf(id)){o.skipped.push({name:it.name,msg:'لا يمكن حذف غرض معار حالياً. سجّل إرجاعه أولاً.'});continue;}
 const t=mkTrash('item',it.name,pathStr(it.placeId),[['items',it]],B);o.ops.push(['del','items',id],t.op);o.tids.push(t.id);o.names.push(it.name);o.n++;o.sub='كان في: '+pathStr(it.placeId);}return o;}
function bPlaces(ids,mode,dest,B){const o=bnew();const picked=new Set([...ids].filter(i=>get('places',i)));if(!picked.size)return o;
 const top=[...picked].filter(i=>!pathIds(get('places',i).parentId).some(a=>picked.has(a.id)));
 if(mode==='move'){
  if(!dest||!get('places',dest)||picked.has(dest)||top.some(i=>descendants(i).includes(dest)))throw new Error('اختر مكاناً صالحاً لنقل المحتويات إليه');
  for(const id of picked){const p=get('places',id);
   for(const k of kids(id))if(!picked.has(k.id))o.ops.push(['put','places',{...k,parentId:dest}]);
   for(const i of all('items').filter(x=>x.placeId===id))o.ops.push(['put','items',{...i,placeId:dest,moves:[...(i.moves||[]),{from:id,to:dest,fromPath:pathStr(id),toPath:pathStr(dest),at:B.at,reason:'حذف المكان'}]}]);
   const t=mkTrash('place',p.name,'حُذف مع نقل محتوياته إلى «'+pathStr(dest)+'»',[['places',p]],B,{rootId:id});
   o.ops.push(['del','places',id],t.op);o.tids.push(t.id);o.names.push(p.name);o.n++;o.sub='نُقلت المحتويات إلى «'+pathStr(dest)+'»';}
  return o;}
 for(const id of top){const p=get('places',id),ids2=[id,...descendants(id)],set2=new Set(ids2);
  const its=all('items').filter(i=>set2.has(i.placeId)),lo=its.filter(i=>i.status==='loaned'||loanOf(i.id));
  if(lo.length){o.skipped.push({name:p.name,msg:'لا يمكن الحذف: يوجد غرض معار حالياً ('+lo.map(i=>i.name).join('، ')+'). سجّل إرجاعه أولاً.'});continue;}
  const recs=[...ids2.map(x=>['places',get('places',x)]),...its.map(i=>['items',i])],sub=`${ids2.length-1} مكان فرعي • ${its.length} غرض`;

  ids2.forEach(x=>o.ops.push(['del','places',x]));its.forEach(i=>o.ops.push(['del','items',i.id]));
  o.ops.push(t.op);o.tids.push(t.id);o.names.push(p.name);o.n++;o.sub='حُذف مع '+sub;}
 return o;}
function bDevices(ids,B){const o=bnew();for(const id of new Set(ids)){const d=get('devices',id);if(!d)continue;const cs=all('contents').filter(c=>c.deviceId===id),sub=`${d.type} • ${cs.length} محتوى`;

function bContents(ids,B){const o=bnew();for(const id of new Set(ids)){const c=get('contents',id);if(!c)continue;const dv=get('devices',c.deviceId),sub=(dv?dv.name:'—')+' • '+fmtBytes(c.sizeBytes);
 const t=mkTrash('content',c.name,sub,[['contents',c]],B);o.ops.push(['del','contents',id],t.op);o.tids.push(t.id);o.names.push(c.name);o.n++;o.sub=sub;}return o;}

async function bulkRemove(spec,strict){
 const B={at:nowISO(),batch:uid('b')},ops=[],tids=[],skipped=[];let total=0;
 const parts=[[bPlaces(spec.places||[],spec.placeMode||'cascade',spec.placeDest,B),'place_del','مكان'],[bItems(spec.items||[],B),'item_del','غرض'],[bDevices(spec.devices||[],B),'dev_del','وحدة تخزين'],[bContents(spec.contents||[],B),'content_del','محتوى'],[bProducts(spec.products||[],B),'prod_del','منتج'],[bLoans(spec.loans||[],B),'loan_del','سجل إعارة'],[bReminders(spec.reminders||[],B),'rem_del','تذكير']];
 for(const [o,type,label] of parts){skipped.push(...o.skipped);if(!o.n)continue;ops.push(...o.ops);tids.push(...o.tids);total+=o.n;
  const one=o.n===1;ops.push(logOp(type,one?o.names[0]:`${o.n} ${label}`,one?o.sub:o.names.slice(0,12).join('، ')+(o.n>12?` … و${o.n-12} أخرى`:''),null));}
 if(strict&&skipped.length)throw new Error(skipped[0].msg);
 if(!total)throw new Error(skipped.length?skipped[0].msg:'لا توجد عناصر للحذف');
 await commit(ops);return{tids,total,skipped};}
const removePlace=async(id,mode,dest)=>(await bulkRemove({places:[id],placeMode:mode,placeDest:dest},true)).tids;
const removeItem=async id=>(await bulkRemove({items:[id]},true)).tids;

async function restoreEntries(tids){
 const ents=[...new Set(tids)].map(getTrash).filter(Boolean).sort((a,b)=>TRASH_ORDER.indexOf(a.kind)-TRASH_ORDER.indexOf(b.kind));
 if(!ents.length)throw new Error('العناصر غير موجودة في السلة');
 const pend=new Set();ents.forEach(e=>e.records.forEach(([st,o])=>pend.add(st+':'+o.id)));
 const have=(st,id)=>!!get(st,id)||pend.has(st+':'+id),ops=[],failed=[],names=[];let fb=null,moved=0,restored=0;
 const fallback=()=>{if(fb)return fb;const ex=all('places').find(p=>p.name==='عناصر مستعادة'&&!p.parentId);if(ex)return(fb=ex.id);
  const np={id:uid('pl'),name:'عناصر مستعادة',icon:'♻️',parentId:null,image:'',description:'أغراض استُرجعت من السلة ولم يعد مكانها الأصلي موجوداً',notes:'',createdAt:nowISO()};ops.push(['put','places',np]);return(fb=np.id);};
 for(const e of ents){const recs=e.records.map(([st,o])=>[st,{...o}]);
  if(e.kind==='place'){const r=recs.find(x=>x[0]==='places'&&x[1].id===e.rootId);if(r&&r[1].parentId&&!have('places',r[1].parentId))r[1].parentId=null;}
  else if(e.kind==='item'){const it=recs[0][1];if(!have('places',it.placeId)){it.placeId=fallback();moved++;}}
  else if(e.kind==='content'){if(!have('devices',recs[0][1].deviceId)){failed.push(e.name);continue;}}
  recs.forEach(([st,o])=>ops.push(['put',st,o]));ops.push(['del','settings','trash:'+e.id]);restored++;names.push(e.name);}
 if(restored)ops.push(logOp('trash_restore',restored===1?names[0]:`${restored} عنصر`,names.slice(0,12).join('، ')+(names.length>12?` … و${names.length-12} أخرى`:''),null));
 if(ops.length)await commit(ops);
 return{restored,failed,moved};}
async function purgeTrash(tids){const ents=[...new Set(tids)].map(getTrash).filter(Boolean);if(!ents.length)return 0;
 await commit([...ents.map(e=>['del','settings','trash:'+e.id]),logOp('trash_purge',ents.length===1?ents[0].name:`${ents.length} عنصر`,ents.slice(0,12).map(e=>e.name).join('، '),null)]);return ents.length;}
async function purgeExpired(){const lim=Date.now()-trashDays()*864e5,old=trashEntries().filter(e=>new Date(e.deletedAt).getTime()<lim);if(old.length)await commit(old.map(e=>['del','settings','trash:'+e.id]));return old.length;}
function trashToast(msg,tids){toast(msg+' — في سلة المحذوفات','ok',{undo:async()=>{const r=await restoreEntries(tids);trashResultToast(r);render();},dur:6000});}
function trashResultToast(r){if(r.restored)toast(`تم استرجاع ${r.restored} عنصر`+(r.moved?` — ${r.moved} وُضع في «عناصر مستعادة» لأن مكانه الأصلي لم يعد موجوداً`:''),r.moved?'warn':'ok',{dur:5000});
 if(r.failed.length)alertBox('تعذّر استرجاع: '+r.failed.join('، ')+'\nاسترجع وحدة التخزين الأصلية أولاً ثم أعد المحاولة.','تعذّر الاسترجاع جزئياً');}
async function moveItemsTo(ids,pid){if(!get('places',pid))throw new Error('اختر المكان الجديد');const at=nowISO(),ops=[],names=[];
 for(const id of new Set(ids)){const it=get('items',id);if(!it||it.placeId===pid)continue;ops.push(['put','items',{...it,placeId:pid,moves:[...(it.moves||[]),{from:it.placeId,to:pid,fromPath:pathStr(it.placeId),toPath:pathStr(pid),at}]}]);names.push(it.name);}
 if(!ops.length)throw new Error('كل الأغراض المحددة موجودة بالفعل في هذا المكان');

async function setItemsStatus(ids,st,note){if(!['available','lost','maintenance'].includes(st))throw new Error('حالة غير صالحة');const ops=[],names=[];let skipped=0;

function selAll(){const els=selElems(),every=els.length&&els.every(e=>selHas(e.dataset.sk,e.dataset.sid));if(every)SEL.ids={};else els.forEach(e=>selAdd(e.dataset.sk,e.dataset.sid));decorateSel();}
function selClick(el,shift){const k=el.dataset.sk,id=el.dataset.sid;
 if(shift&&SEL._last){const els=selElems(),a=els.findIndex(x=>x.dataset.sk+':'+x.dataset.sid===SEL._last),b=els.indexOf(el);
  if(a>=0&&b>=0){const [lo,hi]=a<b?[a,b]:[b,a];for(let i=lo;i<=hi;i++)selAdd(els[i].dataset.sk,els[i].dataset.sid);SEL._last=k+':'+id;decorateSel();return;}}
 selFlip(k,id);SEL._last=k+':'+id;decorateSel();}
function decorateSel(){
 const v=$('#view');if(!v)return;const els=selElems();v.classList.toggle('selon',SEL.on);
 if(SEL.on){
  const vis={};els.forEach(e=>{(vis[e.dataset.sk]||(vis[e.dataset.sk]=new Set())).add(e.dataset.sid);});
  for(const k in SEL.ids)for(const id of [...SEL.ids[k]])if(!(vis[k]&&vis[k].has(id)))SEL.ids[k].delete(id);
  els.forEach(e=>{const on=selHas(e.dataset.sk,e.dataset.sid);e.classList.add('selectable');e.classList.toggle('selected',on);e.setAttribute('aria-selected',on);
   if(!e.querySelector(':scope>.selmark'))e.insertAdjacentHTML('afterbegin','<span class="selmark" aria-hidden="true">'+ic('check','sm')+'</span>');});
 }else{
  els.forEach(e=>{e.classList.remove('selectable','selected');e.removeAttribute('aria-selected');const m=e.querySelector(':scope>.selmark');if(m)m.remove();});
  if(els.length&&!$('#seltb')){const btn=`<button class="btn" id="seltb" data-act="selToggle">${ic('check','sm')} تحديد</button>`,pact=$('.pact',v);
   if(pact)pact.insertAdjacentHTML('beforeend',btn);else v.insertAdjacentHTML('afterbegin','<div class="pact" style="margin-bottom:10px">'+btn+'</div>');}
 }
 renderSelBar();}
function renderSelBar(){

 if(!bar){bar=document.createElement('div');bar.id='selbar';bar.className='selbar';bar.setAttribute('role','toolbar');bar.setAttribute('aria-label','إجراءات التحديد');document.body.appendChild(bar);}
 const n=selTotal(),els=selElems(),allSel=els.length&&els.every(e=>selHas(e.dataset.sk,e.dataset.sid));
 const kinds=Object.keys(SEL.ids).filter(k=>SEL.ids[k].size),onlyItems=kinds.length&&kinds.every(k=>k==='item'),onlyTrash=kinds.length&&kinds.every(k=>k==='trash'),d=n?'':'disabled';
 bar.innerHTML=`<div class="selinfo"><b>${n}</b> محدد<small>من ${els.length}</small></div><div class="selbtns"><button class="btn sm" data-act="selAll">${allSel?'إلغاء تحديد الكل':'تحديد الكل ('+els.length+')'}</button>${onlyTrash?`<button class="btn sm pri" data-act="selRestore" ${d}>استرجاع</button><button class="btn sm danger" data-act="selPurge" ${d}>حذف نهائي</button>`:`${onlyItems?`<button class="btn sm" data-act="selMove" ${d}>نقل</button><button class="btn sm" data-act="selStatus" ${d}>الحالة</button>`:''}<button class="btn sm danger" data-act="selDelete" ${d}>حذف</button>`}<button class="btn sm ghost" data-act="selExit">إلغاء</button></div>`;
 bar.hidden=false;const bn=$('#bnav'),sd=$('#side'),wide=innerWidth>900;
 bar.style.bottom=(bn&&getComputedStyle(bn).display!=='none'?bn.offsetHeight:0)+'px';
 bar.style.insetInlineStart=(wide&&sd?sd.offsetWidth:0)+'px';}
const selSpec=()=>{const g=k=>[...(SEL.ids[k]||[])];return{items:g('item'),places:g('place'),devices:g('device'),contents:g('content'),products:g('product'),loans:g('loan'),reminders:g('reminder')};};
async function selDelete(){
 const sp=selSpec(),days=trashDays(),lines=[],L=(n,l)=>{if(n)lines.push(`• ${n} ${l}`);};
 L(sp.places.length,'مكان');L(sp.items.length,'غرض');L(sp.devices.length,'وحدة تخزين');L(sp.contents.length,'محتوى');L(sp.products.length,'منتج');L(sp.loans.length,'سجل إعارة');L(sp.reminders.length,'تذكير');
 const loaned=sp.items.filter(id=>{const i=get('items',id);return i&&(i.status==='loaned'||loanOf(id));}).length;
 const note=loaned?`\n\nملاحظة: ${loaned} غرض معار حالياً ولن يُحذف (سجّل إرجاعه أولاً).`:'';
 const exclude=new Set();sp.places.forEach(id=>{exclude.add(id);descendants(id).forEach(x=>exclude.add(x));});
 const hasContent=sp.places.some(id=>kids(id).length||all('items').some(i=>i.placeId===id));
 const finish=async spec=>{const r=await bulkRemove(spec,false);selExit();trashToast(`تم نقل ${r.total} عنصر`,r.tids);
  if(r.skipped.length)alertBox('لم تُحذف هذه العناصر:\n• '+r.skipped.map(s=>s.name+' — '+s.msg).join('\n• '),'عناصر لم تُحذف');
  render();};
 if(!hasContent){if(await confirmBox(`سيتم نقل العناصر التالية إلى سلة المحذوفات:\n${lines.join('\n')}${note}\n\nيمكنك استرجاعها خلال ${days} يوماً.`,{ok:'نقل إلى السلة',danger:true,title:'حذف العناصر المحددة'}))await finish(sp);return;}
 const dest=parentOptions(exclude);
 formModal({title:'حذف العناصر المحددة',submit:'نقل إلى السلة',danger:true,
  fields:`<div class="note warn">${ic('alert','sm')} ستنتقل إلى السلة:<br>${lines.join('<br>')}${note?'<br><br>'+esc(note.trim()):''}<br><br>بعض الأماكن المحددة تحتوي أماكن فرعية أو أغراضاً. اختر طريقة التعامل معها (يمكن استرجاع كل شيء من السلة خلال ${days} يوماً):</div><div style="height:10px"></div>${dest.length?`<div class="fld"><label><input type="radio" name="mode" value="move" checked> نقل محتويات الأماكن المحددة إلى مكان آخر ثم حذف الأماكن</label></div>${sel('dest','المكان الوجهة',dest,dest[0][0])}`:''}<div class="fld"><label><input type="radio" name="mode" value="cascade" ${dest.length?'':'checked'}> حذف الأماكن مع كل ما بداخلها</label></div>`,
  onSubmit:async d=>{
    let mode=d.mode||'cascade';
    if(mode==='move'&&!dest.length){mode='cascade';}
    if(mode==='move'&&(!d.dest||!get('places',d.dest))){return 'اختر مكان الوجهة أو اختر الحذف الكامل';}
    await finish({...sp,placeMode:mode,placeDest:d.dest});
  }});}
function selMove(){const ids=[...(SEL.ids.item||[])],opts=parentOptions();if(!ids.length||!opts.length)return;

 formModal({title:`تغيير حالة ${ids.length} غرض`,submit:'تطبيق',fields:sel('st','الحالة الجديدة',[['available',ST.available],['lost',ST.lost],['maintenance',ST.maintenance]],'available')+area('note','ملاحظة (اختياري)'),

 emptyTrash:()=>run(async()=>{const ids=trashEntries().map(e=>e.id);if(ids.length&&await confirmBox(`حذف ${ids.length} عنصر من السلة نهائياً؟ لا يمكن التراجع عن هذا الإجراء.`,{ok:'إفراغ السلة',danger:true})){await purgeTrash(ids);toast('تم إفراغ السلة');render();}})

/* ضغط مطول باللمس يبدأ التحديد */
let _lpT=null,_lpX=0,_lpY=0;
document.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch'||!e.target.closest)return;const el=e.target.closest('#view [data-sk]');if(!el||e.target.closest('input,select,textarea,.favb,[data-act="qtyUp"],[data-act="qtyDown"]'))return;
 _lpX=e.clientX;_lpY=e.clientY;clearTimeout(_lpT);
 _lpT=setTimeout(()=>{SEL._lp=Date.now();SEL._lpF=true;try{getSelection().removeAllRanges();}catch(x){}SEL.on?selClick(el,false):selEnter({k:el.dataset.sk,id:el.dataset.sid});try{navigator.vibrate&&navigator.vibrate(15);}catch(x){}},450);},true);
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>{clearTimeout(_lpT);if(SEL._lpF){SEL._lp=Date.now();SEL._lpF=false;}},true));
document.addEventListener('pointermove',e=>{if(_lpT&&Math.abs(e.clientX-_lpX)+Math.abs(e.clientY-_lpY)>10)clearTimeout(_lpT);},true);
document.addEventListener('contextmenu',e=>{if(Date.now()-SEL._lp<1500&&e.target.closest&&e.target.closest('#view [data-sk]'))e.preventDefault();});
window.addEventListener('resize',()=>{if(SEL.on)renderSelBar();});
